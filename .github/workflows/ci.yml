name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image ships the Android SDK (ANDROID_HOME); this adds Gradle caching.
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (core, phone, wear)
        run: ./gradlew test --stacktrace
      # Screens rendered by the Robolectric render tests, for reviewing UI changes.
      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: |
            phone/build/renders/
            wear/build/renders/
          if-no-files-found: ignore
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '*/build/reports/tests/'
